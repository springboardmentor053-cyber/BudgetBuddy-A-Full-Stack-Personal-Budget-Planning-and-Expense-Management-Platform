          description: ''
components:
  schemas:
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        month:
          type: string
          maxLength: 20
        user:
          type: integer
          readOnly: true
          nullable: true
      required:
      - amount
      - category
      - id
      - month
      - user
    BudgetError:
      type: object
      properties:
        error:

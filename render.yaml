databases:
  - name: budgetbuddy-db
    databaseName: budgetbuddy
    user: budgetbuddy
    plan: free

services:
  # ─── Django Backend ───────────────────────────────────────────────────────
  - type: web
    name: budgetbuddy-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: budgetbuddy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://budgetbuddy-frontend.onrender.com"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ─── React / Vite Frontend ────────────────────────────────────────────────
  - type: web
    name: budgetbuddy-frontend
    runtime: static
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: "https://budgetbuddy-backend.onrender.com/api/"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
